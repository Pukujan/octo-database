name: validation

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: the Slice 8 migration requires the `vector` extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out Octo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare validation tools
        shell: bash
        run: |
          set -euo pipefail
          validation_root=$(mktemp -d "$RUNNER_TEMP/octo-validation.XXXXXX")
          echo "VALIDATION_ROOT=$validation_root" >> "$GITHUB_ENV"
          python -m venv "$validation_root/venv"
          "$validation_root/venv/bin/python" -m pip install -r requirements-ci.txt
          "$validation_root/venv/bin/python" -m pip check

      - name: Ruff lint
        run: '"$VALIDATION_ROOT/venv/bin/ruff" check scripts tests'

      - name: Ruff format
        run: '"$VALIDATION_ROOT/venv/bin/ruff" format --check scripts tests'

      - name: Python type check
        run: '"$VALIDATION_ROOT/venv/bin/mypy"'

      - name: JSON contract integrity
        run: '"$VALIDATION_ROOT/venv/bin/python" scripts/check_json.py'

      - name: Integrity integration tests
        run: '"$VALIDATION_ROOT/venv/bin/python" -m unittest discover -s tests -v'


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript type check
        run: npm run typecheck

      - name: Frontend and authorization tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply database migrations in CI
        run: |
          PGPASSWORD=postgres psql -h localhost -p 54329 -U postgres <<'EOF'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid; $$ LANGUAGE sql STABLE;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS TEXT AS $$ SELECT COALESCE(NULLIF(current_setting('request.jwt.claim.role', true), ''), 'anon'); $$ LANGUAGE sql STABLE;
          DO $$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
          END $$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated;
          EOF
          # Apply every migration in lexical order so new slices are picked up
          # automatically instead of needing this list maintained by hand.
          for migration in $(ls supabase/migrations/*.sql | sort); do
            echo "applying $migration"
            PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -p 54329 -U postgres < "$migration"
          done
          # Slice 14 creates octo_app (the RLS-fenced request role) and octo_service
          # (the BYPASSRLS trusted role) without passwords. Give them throwaway
          # CI-only passwords so the server and the fence check can connect as them.
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -p 54329 -U postgres <<'EOF'
          ALTER ROLE octo_app PASSWORD 'octo_app';
          ALTER ROLE octo_service PASSWORD 'octo_service';
          EOF

      - name: Verify key-scope isolation fence (engine backstop)
        # Proves the slice's invariant directly against the database, bypassing the
        # application's own key-scope check: a session scoped to one workspace can
        # neither read nor write another, even though its principal is a member.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:54329/postgres
          OCTO_DB_URL: postgresql://octo_app:octo_app@localhost:54329/postgres
        run: npx tsx scripts/verify-key-scope-fence.ts

      - name: Playwright E2E and Multimodal Vision QA
        env:
          INFERHUB_API_KEY: ${{ secrets.INFERHUB_API_KEY }}
          # CI has no R2 credentials; opt into the local backend explicitly so the
          # e2e upload path works without weakening the production default.
          OCTO_STORAGE_BACKEND: local
          OCTO_MEDIA_SECRET: ci-media-secret
          OCTO_MFA_SECRET: ci-mfa-secret
          OCTO_SESSION_SECRET: ci-session-secret
          DATABASE_URL: postgresql://postgres:postgres@localhost:54329/postgres
          # Run the server's request path as the fenced octo_app role so the E2E
          # suite proves the golden flows still work under RLS, and the trusted
          # surface as octo_service. Without these the server would connect as the
          # postgres superuser and the fence would be dormant -- a green suite that
          # proves nothing about isolation.
          OCTO_DB_URL: postgresql://octo_app:octo_app@localhost:54329/postgres
          OCTO_SERVICE_URL: postgresql://octo_service:octo_service@localhost:54329/postgres
        run: npx playwright test
      - name: Validate stack-manifest against the certified release train
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/Pukujan/agent-stack-train.git "$VALIDATION_ROOT/train"
          "$VALIDATION_ROOT/venv/bin/python" "$VALIDATION_ROOT/train/scripts/check_manifest.py" \
            --manifest stack-manifest.json \
            --train "$VALIDATION_ROOT/train/stack-releases.json"

      - name: Validate pinned PCM adopter state
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Pukujan/project-continuity-modules.git "$VALIDATION_ROOT/pcm"
          git -C "$VALIDATION_ROOT/pcm" checkout --quiet 4e2385474b4af9249ca009cbdcb38c4498932475
          PYTHONPATH="$VALIDATION_ROOT/pcm/src" "$VALIDATION_ROOT/venv/bin/python" -m continuity validate --root .

      - name: Validate full CGM adapter
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Pukujan/content-generation-modules.git "$VALIDATION_ROOT/cgm"
          git -C "$VALIDATION_ROOT/cgm" checkout --quiet 6831f91e165b62d719c05eb492f7375fa932b560
          "$VALIDATION_ROOT/venv/bin/python" "$VALIDATION_ROOT/cgm/scripts/validate_content_system.py" \
            --root "$VALIDATION_ROOT/cgm" \
            --adapter .content-system \
            --project-root .

      - name: Validate pinned ACS hot-loader
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Pukujan/agent-custom-setup.git "$VALIDATION_ROOT/acs"
          git -C "$VALIDATION_ROOT/acs" checkout --quiet 38f8f52e8d210db3ce258bf911ebb560c6e0fe4c
          "$VALIDATION_ROOT/venv/bin/python" "$VALIDATION_ROOT/acs/modules/coordination/multi-agent-hotload/v0.1.0/scripts/hotload_check.py" \
            --root "$VALIDATION_ROOT/acs/modules/coordination/multi-agent-hotload/v0.1.0" \
            --assignment "$GITHUB_WORKSPACE/.coord/assignment.json" \
            --cgm-root "$VALIDATION_ROOT/cgm" \
            --adopter-root "$GITHUB_WORKSPACE"

      - name: Check dev root layout (ACS dev_root_check)
        shell: bash
        run: |
          set -euo pipefail
          "$VALIDATION_ROOT/venv/bin/python" "$VALIDATION_ROOT/acs/modules/coordination/multi-agent-hotload/v0.1.0/scripts/dev_root_check.py" \
            --dev-root "$(dirname "$GITHUB_WORKSPACE")"
