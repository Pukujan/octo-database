name: Issue Triage

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  triage:
    name: Triage Observational Issue
    runs-on: ubuntu-latest
    steps:
      - name: Triage plane, priority, and proposal semantics
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Check if this is an observational issue
            const isObservational = 
              issue.labels.some(l => l.name === 'observational-issue') ||
              body.includes('Contributor Plane') ||
              body.includes('Observational Plane');

            if (!isObservational) {
              console.log('Not an observational issue. Skipping triage.');
              return;
            }

            const labelsToAdd = new Set();
            labelsToAdd.add('observational-issue');
            labelsToAdd.add('proposal');

            // 1. Detect Plane
            let plane = null;
            if (body.includes('Plane 1') || body.includes('Lead Owner')) {
              plane = 1;
              labelsToAdd.add('plane:lead-owner');
            } else if (body.includes('Plane 2') || body.includes('Approved Collaborator')) {
              plane = 2;
              labelsToAdd.add('plane:collaborator');
            } else if (body.includes('Plane 3') || body.includes('Community')) {
              plane = 3;
              labelsToAdd.add('plane:community');
            }

            // 2. Parse Priority Rating (1-100)
            const priorityMatch = body.match(/### Priority Rating[^\n]*\s*([0-9]{1,3})/i) ||
                                  body.match(/Priority Rating[^\n:]*:\s*([0-9]{1,3})/i) ||
                                  body.match(/\b([1-9][0-9]?|100)\b/);

            if (priorityMatch) {
              let pVal = parseInt(priorityMatch[1], 10);
              // Clamp or validate based on plane
              if (plane === 1) {
                pVal = Math.max(1, Math.min(20, pVal));
              } else if (plane === 2) {
                pVal = Math.max(20, Math.min(40, pVal));
              } else if (plane === 3) {
                pVal = Math.max(40, Math.min(100, pVal));
              } else {
                pVal = Math.max(1, Math.min(100, pVal));
              }
              labelsToAdd.add(`priority:p${pVal}`);
            }

            // 3. Apply labels
            const targetLabels = Array.from(labelsToAdd);
            console.log(`Adding labels to issue #${issue.number}:`, targetLabels);

            // Ensure labels exist before adding
            for (const name of targetLabels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (e) {
                // Label does not exist, create it
                const color = name.startsWith('plane:lead-owner') ? 'd93f0b' :
                              name.startsWith('plane:collaborator') ? '0075ca' :
                              name.startsWith('plane:community') ? '0e8a16' :
                              name.startsWith('priority:p') ? 'b60205' : '6f42c1';
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description: `Automated label for ${name}`,
                  });
                } catch (createErr) {
                  console.log(`Note: could not create label ${name}:`, createErr.message);
                }
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: targetLabels,
            });
