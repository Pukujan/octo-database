name: octo

services:
  octo-web:
    build:
      context: ../..
      dockerfile: deploy/gravebuster/Dockerfile.web
    image: octo-web:${IMAGE_TAG:-latest}
    container_name: octo-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8091}:80"
    depends_on:
      octo-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - octo-internal

  octo-api:
    build:
      context: ../..
      dockerfile: deploy/gravebuster/Dockerfile.api
    image: octo-api:${IMAGE_TAG:-latest}
    container_name: octo-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3001
    depends_on:
      octo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3001/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - octo-internal

  octo-db:
    image: pgvector/pgvector:pg16
    container_name: octo-db
    restart: unless-stopped
    # A workspace's provisioned database is meant to be connected to by an ordinary
    # Postgres client, so the port is published. The bind address defaults to
    # loopback: nothing is reachable until OCTO_DB_PUBLISH_ADDR is set, because a
    # published port is not protected by the host firewall (Docker inserts its own
    # rules ahead of it). Set it to the Tailscale address to reach it from the
    # tailnet only.
    ports:
      - "${OCTO_DB_PUBLISH_ADDR:-127.0.0.1}:${OCTO_DB_PUBLIC_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - octo-db-data:/var/lib/postgresql/data
      - ./initdb/00-supabase-auth-scaffold.sql:/docker-entrypoint-initdb.d/00-supabase-auth-scaffold.sql:ro
      - ./initdb/01-apply-migrations.sh:/docker-entrypoint-initdb.d/01-apply-migrations.sh:ro
      - ../../supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - octo-internal

networks:
  octo-internal:
    name: octo_internal
    driver: bridge

volumes:
  octo-db-data:
    name: octo-db-data
